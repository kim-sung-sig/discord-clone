spring:
  config:
    import: optional:configtree:${DISCORD_JWT_CONFIG_TREE:/etc/discord-config/}
  application:
    name: discord-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
