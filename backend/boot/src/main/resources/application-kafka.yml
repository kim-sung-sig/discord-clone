spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

discord:
  kafka:
    enabled: ${DISCORD_KAFKA_ENABLED:true}
    topic-prefix: ${DISCORD_KAFKA_TOPIC_PREFIX:discord}
    gateway-dlq-retention-hours: ${DISCORD_KAFKA_GATEWAY_DLQ_RETENTION_HOURS:168}
    gateway-dlq-alert-threshold: ${DISCORD_KAFKA_GATEWAY_DLQ_ALERT_THRESHOLD:1}
    message-publish-timeout-ms: ${DISCORD_KAFKA_MESSAGE_PUBLISH_TIMEOUT_MS:5000}
